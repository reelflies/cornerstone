# ReelFlies checks for every pull request and every push to master (ticket 06).
# This never pushes to BigCommerce: no store credentials live in the repo or its secrets.
# It replaces upstream's pull_request_review.yml, which installed an unpinned stencil-cli.

name: Checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0 # gitleaks scans the whole history

    - name: Use Node.js from .nvmrc
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Secret scan (gitleaks)
      env:
        GITLEAKS_VERSION: 8.30.1
        GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      run: |
        cd "$RUNNER_TEMP"
        curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
        echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
        tar -xzf gitleaks.tar.gz gitleaks
        cd "$GITHUB_WORKSPACE"
        "$RUNNER_TEMP/gitleaks" git --redact --no-banner .

    - name: Install theme dependencies
      run: npm ci

    - name: Jest
      run: npx jest

    - name: Script tests (node --test)
      run: npm run test:scripts

    - name: ESLint (assets/js and scripts)
      run: npx eslint --ext .js,.mjs assets/js scripts

    - name: Stylelint
      run: npm run stylelint

    - name: Contrast
      run: node scripts/check-contrast.mjs config.json

    - name: Build and bundle (pinned stencil-cli)
      run: npx stencil bundle --name ci-bundle

    - name: Bundle checks
      run: node scripts/check-bundle.mjs ci-bundle.zip
